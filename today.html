<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CH = [
    { k: "chl_focus", auto: "focus" }, { k: "chl_m1" }, { k: "chl_quiz", auto: "quiz" }, { k: "chl_m2" },
    { k: "chl_pred", auto: "pred" }, { k: "chl_m3" }, { k: "chl_m4" }
  ];
  var resetArmed = false;

  function chIndex() { return Math.floor(Date.now() / 86400000 + 3) % CH.length; }
  function focusMinutes() {
    try { var s = JSON.parse(localStorage.getItem("fx_stats") || "null"); return Math.floor(((s && s.days && s.days[actKey()]) || 0) / 60); } catch (e) { return 0; }
  }

  function render() {
    var a = actLoad(), day = a.days[actKey()] || {}, ch = CH[chIndex()];
    // auto challenge
    if (ch.auto && day[ch.auto] > 0 && !(day.ch > 0)) { recordAct("ch", 30); a = actLoad(); day = a.days[actKey()] || {}; }
    var chDone = day.ch > 0;
    var streak = actStreak();

    // next step
    var nx = !(day.focus > 0) ? "focus" : !(day.quiz > 0) ? "quiz" : !(day.pred > 0) ? "pred" : !chDone ? "ch" : "done";
    $("tdNextT").textContent = t("nx_" + nx + "_t");
    $("tdNextD").textContent = t("nx_" + nx + "_d");
    var b = $("tdNextB"); b.textContent = t("nx_" + nx + "_b");
    b.setAttribute("href", { focus: "/focus", quiz: "/quiz", pred: "/predict", ch: "#challenge", done: "/predict" }[nx]);
    $("tdMas").innerHTML = window.mascot(nx === "done" || streak > 2 ? "cheer" : "happy");

    // stats
    $("tdStreak").textContent = streak;
    $("tdStreakN").textContent = streak > 0 ? t("st_streak1") : t("st_streak0");
    var xp = a.xp || 0, lvl = Math.floor(xp / 100) + 1;
    $("tdLvl").textContent = lvl;
    $("tdXpBar").style.width = (xp % 100) + "%";
    $("tdXp").textContent = xp + " " + t("st_pts") + " · " + (100 - xp % 100) + " " + t("st_next");
    $("tdMin").textContent = focusMinutes();

    // challenge
    $("chSub").textContent = t("ch_sub");
    $("chBox").innerHTML = '<div class="td-chq">' + t(ch.k) + "</div>" +
      (chDone ? '<div class="td-chok">✅ ' + t("ch_done") + "</div>"
        : ch.auto ? '<div class="note">' + t("ch_auto") + "</div>"
        : '<button class="btn" id="chBtn">' + t("ch_btn") + "</button>");
    var cb = $("chBtn"); if (cb) cb.onclick = function () { recordAct("ch", 30); render(); };

    // activities
    var rows = [["focus", "qa_focus", 25, 4], ["quiz", "qa_quiz", 30, 1], ["pred", "qa_pred", 20, 3]];
    $("tdActs").innerHTML = rows.map(function (r) {
      var n = day[r[0]] || 0, ok = n > 0;
      return '<div class="td-act' + (ok ? " ok" : "") + '"><span class="td-chk">' + (ok ? "✓" : "") + "</span><span>" + t(r[1]) + (n > 1 ? " ×" + n : "") + "</span><b>+" + Math.min(n, r[3]) * r[2] + " " + t("st_pts") + "</b></div>";
    }).join("");

    // week
    var vals = [], labels = [], max = 60, i, d, lg = document.documentElement.lang || "en", w;
    for (i = 6; i >= 0; i--) {
      d = new Date(); d.setDate(d.getDate() - i);
      var v = ((a.days[actKey(d)] || {}).xp) || 0; vals.push(v); if (v > max) max = v;
      try { w = d.toLocaleDateString(lg, { weekday: "short" }); } catch (e) { w = ""; }
      labels.push(w);
    }
    $("tdBars").innerHTML = vals.map(function (v, j) {
      return '<div title="' + v + " " + t("st_pts") + '"><i style="height:' + Math.round(v / max * 84) + 'px"></i>' + labels[j] + "</div>";
    }).join("");

    var ns = $("navStreak"); if (ns) ns.textContent = streak;
    $("tdReset").textContent = resetArmed ? t("td_reset2") : t("td_reset");
  }

  $("tdReset").onclick = function () {
    if (!resetArmed) { resetArmed = true; render(); setTimeout(function () { resetArmed = false; render(); }, 4000); return; }
    try { localStorage.removeItem("act"); } catch (e) {}
    resetArmed = false; render();
  };
  window.onLang = render;
  render();
})();
</script>
<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    var b = document.getElementById("install"); if (b) b.hidden = false;
  });
  window.addEventListener("appinstalled", function () {
    deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true;
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target || ev.target.id !== "install" || !deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true; });
  });
})();
</script>
