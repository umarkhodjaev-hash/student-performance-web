      setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    };
    document.getElementById("lang").onchange = function () {
      lang = this.value;
      try { localStorage.setItem("lang", lang); } catch (e) {}
      applyLang();
    };
    document.getElementById("burger").onclick = function () {
      document.getElementById("links").classList.toggle("open");
    };
    applyLang();
    /* wake the free Render server in the background */

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CH = [
    { k: "chl_focus", auto: "focus" }, { k: "chl_m1" }, { k: "chl_quiz", auto: "quiz" }, { k: "chl_m2" },
    { k: "chl_pred", auto: "pred" }, { k: "chl_m3" }, { k: "chl_m4" }
  ];
  var resetArmed = false;
  var PLAN = {
    sleep: [{ k: "ct_sleep1" }, { k: "ct_sleep2" }, { k: "ct_sleep3" }],
    att: [{ k: "ct_att1" }, { k: "ct_att2" }, { k: "ct_att3" }],
    study: [{ k: "ct_study1", auto: "focus" }, { k: "ct_study2" }, { k: "ct_study3" }],
    mot: [{ k: "ct_mot1" }, { k: "ct_mot2" }, { k: "ct_mot3" }]

  }
  function todayChallenge() {

    if (w) { var L = PLAN[w]; var c = L[day % L.length]; return { k: c.k, auto: c.auto, f: w }; }
    var c0 = CH[day % CH.length]; return { k: c0.k, auto: c0.auto, f: null };
  }

  function chIndex() { return Math.floor(Date.now() / 86400000 + 3) % CH.length; }
  function focusMinutes() {
    try { var s = JSON.parse(localStorage.getItem("fx_stats") || "null"); return Math.floor(((s && s.days && s.days[actKey()]) || 0) / 60); } catch (e) { return 0; }
  }

  function render() {
    var a = actLoad(), day = a.days[actKey()] || {}, ch = todayChallenge();
    // auto challenge
    if (ch.auto && day[ch.auto] > 0 && !(day.ch > 0)) { recordAct("ch", 30); a = actLoad(); day = a.days[actKey()] || {}; }
    var chDone = day.ch > 0;
    var streak = actStreak();

    // next step
    var hist = histLoad(), lastT = hist.length ? hist[hist.length - 1].t : 0, daysAgo = lastT ? Math.floor((Date.now() - lastT) / 86400000) : 0;
    var stale = hist.length > 0 && daysAgo >= 7 && !(day.pred > 0);
    var nx = stale ? "recheck" : !(day.focus > 0) ? "focus" : !(day.quiz > 0) ? "quiz" : !(day.pred > 0) ? "pred" : !chDone ? "ch" : "done";

    $("tdXp").textContent = xp + " " + t("st_pts") + " · " + (100 - xp % 100) + " " + t("st_next");
    $("tdMin").textContent = focusMinutes();

    // challenge
    $("chSub").textContent = ch.f ? t("pl_badge").replace("{f}", t("wf_" + ch.f)) + ". " + t("pl_sub") : t("ch_sub");

      (chDone ? '<div class="td-chok">✅ ' + t("ch_done") + "</div>"

    var cb = $("chBtn"); if (cb) cb.onclick = function () { recordAct("ch", 30); render(); };

    // activities

    $("tdActs").innerHTML = rows.map(function (r) {
      var n = day[r[0]] || 0, ok = n > 0;
      return '<div class="td-act' + (ok ? " ok" : "") + '"><span class="td-chk">' + (ok ? "✓" : "") + "</span><span>" + t(r[1]) + (n > 1 ? " ×" + n : "") + "</span><b>+" + Math.min(n, r[3]) * r[2] + " " + t("st_pts") + "</b></div>";
    }).join("");

    // week
    var vals = [], labels = [], max = 60, i, d, lg = document.documentElement.lang || "en", w;
    for (i = 6; i >= 0; i--) {
      d = new Date(); d.setDate(d.getDate() - i);
      var v = ((a.days[actKey(d)] || {}).xp) || 0; vals.push(v); if (v > max) max = v;

      return '<div title="' + v + " " + t("st_pts") + '"><i style="height:' + Math.round(v / max * 84) + 'px"></i>' + labels[j] + "</div>";

  function renderProgress(h, daysAgo) {

    else if (d < -0.05) msg = t("pg_down").replace("{d}", Math.round(-d * 10) / 10).replace("{a}", first.p).replace("{b}", last.p);
    else msg = t("pg_same").replace("{a}", last.p);
    var why = [];
    if (h.length > 1 && first.x && last.x) {
      var fx = first.x, lx = last.x;
      if (fx.sleep_hours !== lx.sleep_hours && lx.sleep_hours != null) why.push(t("chg_sleep").replace("{a}", fx.sleep_hours).replace("{b}", lx.sleep_hours));
      if (fx.hours_studied !== lx.hours_studied && lx.hours_studied != null) why.push(t("chg_study").replace("{a}", fx.hours_studied).replace("{b}", lx.hours_studied));
      var fa = fx.classes_per_week > 0 ? Math.round(Math.min(100, fx.classes_attended / fx.classes_per_week * 100)) : 0;
      var la = lx.classes_per_week > 0 ? Math.round(Math.min(100, lx.classes_attended / lx.classes_per_week * 100)) : 0;
      if (fa !== la) why.push(t("chg_att").replace("{a}", fa).replace("{b}", la));
    }
    var pts = h.map(function (r) { return r.p; }), mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts);
    if (mx - mn < 5) { mx += 3; mn -= 3; }
    var W = 600, H = 130, n = pts.length, xy = pts.map(function (v, i) {
      return [n === 1 ? W / 2 : 40 + i * (W - 80) / (n - 1), H - 22 - (v - mn) / (mx - mn) * (H - 70)];
    });
    var imin = pts.indexOf(Math.min.apply(null, pts)), imax = pts.indexOf(Math.max.apply(null, pts));
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block" role="img"><polyline fill="none" stroke="var(--brand)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="' +
      xy.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" ") + '"/>' +
      xy.map(function (q, i) {
        var show = n <= 8 || i === 0 || i === n - 1 || i === imin || i === imax;
        return '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="7" fill="var(--brand)"><title>' + pts[i] + "</title></circle>" +
          (show ? '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] - 16).toFixed(1) + '" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">' + pts[i] + "</text>" : "");
      }).join("") + "</svg>";
    var foot = daysAgo >= 7 ? '<p class="note" style="margin:12px 0">' + t("pg_stale").replace("{d}", daysAgo) + '</p><a class="btn" href="/predict">' + t("pg_recheck") + "</a>"
      : '<p class="note" style="margin:12px 0 0">' + t("pg_ok").replace("{d}", 7 - daysAgo) + "</p>";
    box.innerHTML = svg + '<p style="margin:10px 0 4px"><b>' + msg + "</b></p>" +
      (why.length ? '<p class="note" style="margin:0">' + t("pg_why") + " " + why.join("; ") + "</p>" : "") + foot;
  }

  $("tdReset").onclick = function () {
    if (!resetArmed) { resetArmed = true; render(); setTimeout(function () { resetArmed = false; render(); }, 4000); return; }
    try { localStorage.removeItem("act"); } catch (e) {}
    resetArmed = false; render(); if (window.accForce) window.accForce();
  };
  window.onLang = render;
  window.tdRender = render;
  render();
})();

<script>

(function () {
  var ICONS = {"first": "🌱", "ses10": "🍅", "ses50": "🏆", "h5": "⏱️", "h25": "🔥", "st3": "📅", "st7": "⚡", "st30": "👑", "quiz": "🧠", "quiz3": "🎓", "pred": "📊", "up": "📈", "goal": "🎯"}, IDS = ["first", "ses10", "ses50", "h5", "h25", "st3", "st7", "st30", "quiz", "quiz3", "pred", "up", "goal"];
  var grid = document.getElementById("achGrid"), sub = document.getElementById("achSub");
  function jget(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || "null"); return v === null ? d : v; } catch (e) { return d; } }
  function longest(days) {
    var ks = Object.keys(days).filter(function (k) { return window.actDone(days[k]); }).sort(), best = 0, run = 0, prev = null;
    ks.forEach(function (k) {
      var p = k.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);

      fb = {
        onAuth: function (cb) { U.onAuthStateChanged(auth, cb); },
        signIn: function () { return U.signInWithPopup(auth, new U.GoogleAuthProvider()); },
        signOut: function () { return U.signOut(auth); },
        get: function (uid) { return F.getDoc(F.doc(db, "users", uid)).then(function (d) { return d.exists() ? d.data().d : null; }); },
        set: function (uid, str) { return F.setDoc(F.doc(db, "users", uid), { d: str, u: Date.now() }); }

      return fb;
    });
  }

  function rd(k) { try { var v = localStorage.getItem(k); if (v === null) return null; return k === "fx_name" ? v : JSON.parse(v); } catch (e) { return null; } }
  function snap() { var o = {}; KEYS.forEach(function (k) { var v = rd(k); if (v !== null) o[k] = v; }); return o; }
  function maxMap(a, b) { var o = {}, k; a = a || {}; b = b || {}; for (k in a) o[k] = a[k]; for (k in b) o[k] = Math.max(o[k] || 0, b[k] || 0); return o; }
  function merge(a, b) {
    b = b || {}; var o = {}, k;
    // activity: per day, per kind max; points recomputed from days
    var days = {}, da = (a.act && a.act.days) || {}, db = (b.act && b.act.days) || {};
    for (k in da) days[k] = da[k];
    for (k in db) days[k] = days[k] ? maxMap(days[k], db[k]) : db[k];
    var xp = 0; for (k in days) xp += days[k].xp || 0;
    if (Object.keys(days).length) o.act = { days: days, xp: xp };
    // history: union by timestamp, keep latest 12
    var seen = {}, h = (a.history || []).concat(b.history || []).filter(function (r) { if (!r || seen[r.t]) return false; seen[r.t] = 1; return true; });
    h.sort(function (x, y) { return x.t - y.t; }); if (h.length > 12) h = h.slice(h.length - 12);
    if (h.length) { o.history = h; o.last = null; }
    var la = a.last, lb = b.last, ta = (a.history || []).length ? a.history[a.history.length - 1].t : 0, tb = (b.history || []).length ? b.history[b.history.length - 1].t : 0;
    var lastv = ta >= tb ? (la || lb) : (lb || la);
    if (lastv) o.last = lastv; else delete o.last;
    // focus stats
    var fa = a.fx_stats, fbb = b.fx_stats;
    if (fa || fbb) o.fx_stats = { days: maxMap(fa && fa.days, fbb && fbb.days), ses: maxMap(fa && fa.ses, fbb && fbb.ses) };
    if (a.qbest || b.qbest) o.qbest = maxMap(a.qbest, b.qbest);
    var nm = a.fx_name || b.fx_name; if (nm) o.fx_name = nm;
    var ex = a.exam || b.exam; if (ex) o.exam = ex;
    if (a.fx_sub || b.fx_sub) {
      var sd = {}, xa = (a.fx_sub && a.fx_sub.days) || {}, xb = (b.fx_sub && b.fx_sub.days) || {};
      for (k in xa) sd[k] = xa[k];
      for (k in xb) sd[k] = sd[k] ? maxMap(sd[k], xb[k]) : xb[k];

    var sl = (a.fx_subj_list || []).concat(b.fx_subj_list || []).filter(function (v, i, arr) { return arr.indexOf(v) === i; }).slice(0, 8);

  function apply(o) {

  }

  function say() {
    var h;
    if (!user) {
      h = '<p class="note" style="margin:0 0 12px">' + t("ac_lead") + '</p><button class="btn" id="accIn">' + t("ac_btn") + "</button>" +
        (state === "err" ? '<p class="note" style="margin:10px 0 0;color:var(--bad)">' + t("ac_err") + "</p>" : "");
    } else {
      var when = lastSync ? new Date(lastSync).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
      h = '<p style="margin:0 0 4px"><b>' + t("ac_in").replace("{n}", esc(user.displayName || user.email || "")) + "</b></p>" +
        '<p class="note" style="margin:0 0 4px">' + (state === "busy" ? t("ac_busy") : state === "err" ? t("ac_err") : t("ac_sync") + (when ? " " + t("ac_last").replace("{t}", when) : "")) + "</p>" +
        '<button class="chip" id="accOut" style="margin-top:8px">' + t("ac_out") + "</button>";
    }
    h += '<p class="note" style="margin:14px 0 0;font-size:13px">' + t("ac_priv") + "</p>";
    box.innerHTML = h;
    var i = document.getElementById("accIn"); if (i) i.onclick = signIn;
    var o = document.getElementById("accOut"); if (o) o.onclick = signOut;
  }
  function esc(v) { return String(v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function sync(force) {
    if (!user || !fb) return Promise.resolve();
    state = "busy"; say();
    return fb.get(user.uid).then(function (remote) {
      var rem = null; try { rem = remote ? JSON.parse(remote) : null; } catch (e) {}
      var out = force ? snap() : merge(snap(), rem);
      if (!force) apply(out);
      var str = JSON.stringify(out);
      lastStr = str;
      var p = (str !== remote) ? fb.set(user.uid, str) : Promise.resolve();
      return p.then(function () { state = "ok"; lastSync = Date.now(); say(); if (window.tdRender) window.tdRender(); });
    }).catch(function () { state = "err"; say(); });
  }
  function signIn() {
    state = "busy"; say();
    load().then(function (f) { return f.signIn(); }).catch(function () { state = "err"; say(); });
  }
  function signOut() { load().then(function (f) { return f.signOut(); }); }

  window.accForce = function () { if (user) sync(true); };
  window.accSay = say;

  say();
  load().then(function (f) {
    f.onAuth(function (u) {
      user = u || null; state = "idle"; say();
      if (timer) { clearInterval(timer); timer = null; }
      if (user) { sync(); timer = setInterval(function () { sync(); }, 60000); }
    });

  document.addEventListener("visibilitychange", function () { if (document.hidden && user) sync(); });
  var oldLang = window.onLang; window.onLang = function () { if (oldLang) oldLang(); say(); };
})();

</script>
<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    var b = document.getElementById("install"); if (b) b.hidden = false;
  });
  window.addEventListener("appinstalled", function () {
    deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true;
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target || ev.target.id !== "install" || !deferred) return;
    deferred.prompt();

  });
