  teacher_quality: { o: L3, v: "Medium" }, peer_influence: { o: ["Positive", "Neutral", "Negative"], v: "Neutral" },
  distance_from_home: { o: ["Near", "Moderate", "Far"], v: "Moderate" }, motivation_level: { o: L3, v: "Medium" },

var step = 0, S = {}, res = null;
Object.keys(R).forEach(function (k) { S[k] = R[k].v; });
Object.keys(C).forEach(function (k) { S[k] = C[k].v; });

function maxOf(id) { return id === "classes_attended" ? S.classes_per_week : R[id].max; }
function unit(u) { return u === "h" ? " " + t("u_h") : u === "d" ? " " + t("u_d") : ""; }
function attendance(x) { return x.classes_per_week <= 0 ? 0 : Math.round(Math.min(100, x.classes_attended / x.classes_per_week * 100) * 10) / 10; }
function lvl(p) { return p >= 80 ? "excellent" : p >= 70 ? "verygood" : p >= 60 ? "dev" : "need"; }

function fieldHTML(id) {

      '<input type="range" id="' + id + '" min="' + r.min + '" max="' + maxOf(id) + '" step="' + r.step + '" value="' + S[id] + '">' +
      '<div class="hint">' + t("h_" + id) + "</div></div>";
  }
  var c = C[id];
  return '<div class="field"><div class="row"><label>' + t("f_" + id) + "</label></div>" +
    '<div class="seg" data-id="' + id + '">' + c.o.map(function (v) {
      return '<button type="button" data-v="' + v + '" class="' + (S[id] === v ? "on" : "") + '">' + t("o_" + v) + "</button>";
    }).join("") + "</div>" +
    '<div class="hint">' + t("h_" + id) + "</div></div>";
}
function syncRange(id) {
  var i = document.getElementById(id);
  if (!i) return;
  var r = R[id], mx = maxOf(id);
  i.max = mx; i.value = S[id];
  i.style.setProperty("--p", ((S[id] - r.min) / ((mx - r.min) || 1) * 100) + "%");
  document.getElementById("o_" + id).textContent = S[id] + unit(r.u);
}
function updAtt() { var a = document.getElementById("attVal"); if (a) a.textContent = attendance(S) + "%"; }
function renderStep() {
  var st = STEPS[step];
  document.getElementById("stepper").innerHTML = STEPS.map(function (s, i) {
    return '<div class="sp ' + (i < step ? "done" : "") + " " + (i === step ? "on" : "") + '"><i></i><span>' + (i + 1) + ". " + t(s.k) + "</span></div>";
  }).join("");
  document.getElementById("panel").innerHTML = '<h3 class="st-t">' + t("t_" + st.k) + '</h3><p class="st-d">' + t("d_" + st.k) + "</p>" +
    '<div class="grid">' + st.f.map(fieldHTML).join("") + "</div>" +
    (step === 0 ? '<div class="att">' + t("attIs") + ' <b id="attVal"></b></div>' : "");
  st.f.forEach(function (id) { if (R[id]) syncRange(id); });
  updAtt();
  var back = document.getElementById("back"), next = document.getElementById("next");
  back.textContent = t("back"); back.style.visibility = step === 0 ? "hidden" : "visible";
  next.textContent = step === STEPS.length - 1 ? t("go") : t("next");
  document.getElementById("error").innerHTML = "";
}
function toTop() { var a = document.getElementById("app"); if (a) a.scrollIntoView({ behavior: "smooth" }); }

async function call(payload, signal) {
  var r = await fetch(API + "/api/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: signal });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function submit() {
  var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 100000);
  document.getElementById("loadT").textContent = t("ld1");
  document.getElementById("loadS").textContent = "";
  document.getElementById("loader").hidden = false;
  var slow = setTimeout(function () { document.getElementById("loadS").textContent = t("ld2"); }, 4000);
  try {
    var d = await call(S, ctl.signal);
    var p = Math.round(d.prediction * 10) / 10;
    res = { p: p, input: Object.assign({}, S), scen: null };
    saveLast(res);
    saveHist(res);
    renderHistory();
    showResult();
    loadScen(res);
  } catch (e) {
    document.getElementById("error").innerHTML = '<div class="err">' + t("errT") + "</div>";
  } finally {
    clearTimeout(to); clearTimeout(slow);
    document.getElementById("loader").hidden = true;
  }
}
async function loadScen(r) {
  var x = r.input, list = [];
  if (x.hours_studied < 55) list.push(["w_study", { hours_studied: x.hours_studied + 5 }]);
  if (x.classes_attended < x.classes_per_week) list.push(["w_att", { classes_attended: x.classes_per_week }]);
  if (x.sleep_hours < 8) list.push(["w_sleep", { sleep_hours: 8 }]);
  if (x.tutoring_sessions < 7) list.push(["w_tutor", { tutoring_sessions: x.tutoring_sessions + 2 }]);
  if (x.motivation_level !== "High") list.push(["w_mot", { motivation_level: "High" }]);
  try {
    var out = await Promise.all(list.map(async function (it) {
      var d = await call(Object.assign({}, x, it[1]));
      return { k: it[0], d: d.prediction - r.p };
    }));
    r.scen = out.sort(function (a, b) { return b.d - a.d; }).slice(0, 4);
  } catch (e) { r.scen = []; }
  if (res === r) renderWhat();
}

function insights(x, att) {
  var a = [], c = [];
  if (att >= 90) a.push("i_att_high"); else if (att < 75) a.push("i_att_low");
  if (x.hours_studied >= 20) a.push("i_study_high"); else if (x.hours_studied < 10) a.push("i_study_low");
  if (x.sleep_hours >= 7) a.push("i_sleep_ok"); else if (x.sleep_hours < 6) a.push("i_sleep_low");
  if (x.previous_scores >= 80) a.push("i_prev_high");
  if (x.motivation_level === "High") a.push("i_mot_high");
  if (x.access_to_resources === "Low") a.push("i_res_low");
  if (x.teacher_quality === "High") a.push("i_teach_high");
  if (x.peer_influence === "Positive") a.push("i_peer_pos");
  if (att < 90) c.push("c_att");
  if (x.hours_studied < 20) c.push("c_study");
  if (x.sleep_hours < 7) c.push("c_sleep");
  if (x.tutoring_sessions === 0) c.push("c_tutor");
  if (x.physical_activity < 2) c.push("c_phys");
  if (x.motivation_level === "Low") c.push("c_mot");
  if (x.access_to_resources === "Low") c.push("c_res");
  if (x.internet_access === "No") c.push("c_net");
  if (x.peer_influence === "Negative") c.push("c_peer");
  if (!c.length) c.push("c_ok");
  return { a: a, c: c };
}

    "<div>" +

    '<div class="box"><h4>' + t("r_rec") + "</h4><ul>" + ic.c.map(function (k) { return "<li>" + t(k) + "</li>"; }).join("") + "</ul></div>" +

}
function renderHistory() {
  var sec = document.getElementById("hist");
  if (!sec) return;
  var h = loadHist(), n = h.length;
  if (!n) { sec.hidden = true; return; }
  sec.hidden = false;
  var W = 600, H = 170, pad = 28;
  var pts = h.map(function (e, i) {
    return [pad + (n === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (n - 1)), H - pad - Math.max(0, Math.min(100, e.p)) / 100 * (H - 2 * pad)];
  });
  var grid = [0, 50, 100].map(function (v) {
    var y = H - pad - v / 100 * (H - 2 * pad);
    return '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/><text x="2" y="' + (y + 4) + '" font-size="11" fill="var(--muted)">' + v + "</text>";
  }).join("");
  var line = n > 1 ? '<polyline fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" points="' + pts.map(function (q) { return q[0] + "," + q[1]; }).join(" ") + '"/>' : "";
  var dots = pts.map(function (q, i) {
    return '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="5" fill="var(--brand)"/><text x="' + q[0] + '" y="' + (q[1] - 10) + '" font-size="12" text-anchor="middle" fill="var(--text)">' + h[i].p + "</text>";
  }).join("");
  document.getElementById("hchart").innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" class="hsvg" role="img" aria-label="' + t("h_chart") + '">' + grid + line + dots + "</svg>";
  document.getElementById("hlist").innerHTML = h.map(function (e, i) { return { e: e, i: i }; }).reverse().map(function (o) {
    return '<div class="hrow"><span>' + fmtDate(o.e.t) + "</span><span>" + "📚 " + o.e.x.hours_studied + " " + t("u_h") +
      " · " + t("r_att") + " " + attendance(o.e.x) + '%</span><b>' + o.e.p + "</b></div>";
  }).join("");
  var cmp = document.getElementById("hcmp");
  if (n < 2) { cmp.innerHTML = '<p class="note" style="margin:0">' + t("h_need") + "</p>"; return; }
  if (cmpN !== n) { cmpA = n - 2; cmpB = n - 1; cmpN = n; }
  var opts = function (sel) {
    return h.map(function (e, i) { return '<option value="' + i + '"' + (i === sel ? " selected" : "") + ">" + fmtDate(e.t) + " · " + e.p + "</option>"; }).join("");
  };
  var A = h[cmpA], B = h[cmpB];
  var F = [
    ["cmp_score", function (e) { return e.p; }, true],
    ["f_hours_studied", function (e) { return e.x.hours_studied; }, true],
    ["r_att", function (e) { return attendance(e.x); }, true],
    ["f_sleep_hours", function (e) { return e.x.sleep_hours; }, true],
    ["f_tutoring_sessions", function (e) { return e.x.tutoring_sessions; }, true],
    ["f_physical_activity", function (e) { return e.x.physical_activity; }, true],
    ["f_previous_scores", function (e) { return e.x.previous_scores; }, true],
    ["f_motivation_level", function (e) { return t("o_" + e.x.motivation_level); }, false]
  ];
  var rows = F.map(function (f) {
    var a = f[1](A), b = f[1](B), d = "", cl = "zero";
    if (f[2]) { var x = Math.round((b - a) * 10) / 10; cl = x > 0 ? "pos" : x < 0 ? "neg" : "zero"; d = (x > 0 ? "+" : "") + x; }
    return "<tr><td>" + t(f[0]) + "</td><td>" + a + "</td><td>" + b + '</td><td><b class="' + cl + '">' + d + "</b></td></tr>";
  }).join("");
  cmp.innerHTML = '<div class="cmpsel"><label>' + t("h_a") + ' <select class="hsel" id="cA">' + opts(cmpA) + "</select></label>" +
    '<label>' + t("h_b") + ' <select class="hsel" id="cB">' + opts(cmpB) + "</select></label></div>" +
    '<table class="cmp"><thead><tr><th></th><th>A</th><th>B</th><th>Δ</th></tr></thead><tbody>' + rows + "</tbody></table>";
  document.getElementById("cA").onchange = function () { cmpA = +this.value; renderHistory(); };
  document.getElementById("cB").onchange = function () { cmpB = +this.value; renderHistory(); };
}

function saveLast(r) {
  try {
    localStorage.setItem("last", JSON.stringify({ p: r.p, h: r.input.hours_studied, a: attendance(r.input), s: r.input.sleep_hours, m: r.input.motivation_level }));
  } catch (e) {}
}

window.onLang = function () { renderStep(); renderResult(); renderHistory(); };

document.addEventListener("DOMContentLoaded", function () {
  var hc = document.getElementById("hclear");
  if (hc) hc.onclick = function () { try { localStorage.removeItem("history"); } catch (e) {} renderHistory(); };
  var panel = document.getElementById("panel");
  panel.addEventListener("input", function (e) {
    var id = e.target.id;
    if (!R[id]) return;
    S[id] = +e.target.value;
    if (id === "classes_per_week") { S.classes_attended = Math.min(S.classes_attended, S.classes_per_week); syncRange("classes_attended"); }
    syncRange(id); updAtt();
  });
  panel.addEventListener("click", function (e) {
    var b = e.target.closest(".seg button");
    if (!b) return;
    var id = b.parentElement.getAttribute("data-id");
    S[id] = b.getAttribute("data-v");
    b.parentElement.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
  });
  document.getElementById("back").onclick = function () { if (step > 0) { step--; renderStep(); toTop(); } };
  document.getElementById("next").onclick = function () {
    if (step < STEPS.length - 1) { step++; renderStep(); toTop(); } else submit();
  };
});

</script>
<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    var b = document.getElementById("install"); if (b) b.hidden = false;
  });
  window.addEventListener("appinstalled", function () {
    deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true;
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target || ev.target.id !== "install" || !deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true; });
  });
})();
</script>
