"d": "to grow and do well", "ru": "процветать, преуспевать", "uz": "gullab-yashnamoq, rivojlanmoq"}, {"id": "w30", "w": "subtle", "p": "adj", "d": "delicate, not obvious", "ru": "тонкий, едва заметный", "uz": "nozik, sezilarsiz"}, {"id": "w31", "w": "indispensable", "p": "adj", "d": "absolutely necessary", "ru": "незаменимый, необходимый", "uz": "ajralmas, zarur"}, {"id": "w32", "w": "ponder", "p": "verb", "d": "to think carefully about", "ru": "обдумывать, взвешивать", "uz": "mulohaza qilmoq"}, {"id": "w33", "w": "arbitrary", "p": "adj", "d": "based on chance, not reason", "ru": "произвольный", "uz": "o'zboshimcha, tasodifiy"}, {"id": "w34", "w": "elaborate", "p": "verb", "d": "to explain in more detail", "ru": "подробно разъяснять", "uz": "batafsil bayon qilmoq"}, {"id": "w35", "w": "skeptical", "p": "adj", "d": "doubtful, not easily convinced", "ru": "скептический", "uz": "shubhali, ishonmaydigan"}, {"id": "w36", "w": "consequently", "p": "adv", "d": "as a result", "ru": "следовательно, в результате", "uz": "natijada, shu sababli"}, {"id": "w37", "w": "sustain", "p": "verb", "d": "to keep something going", "ru": "поддерживать, продолжать", "uz": "davom ettirmoq, qo'llab-quvvatlamoq"}, {"id": "w38", "w": "obsolete", "p": "adj", "d": "no longer used, out of date", "ru": "устаревший", "uz": "eskirgan"}, {"id": "w39", "w": "vivid", "p": "adj", "d": "very clear, bright and detailed", "ru": "яркий, живой", "uz": "yorqin, jonli"}, {"id": "w40", "w": "tedious", "p": "adj", "d": "long, boring and tiring", "ru": "утомительный, скучный", "uz": "zerikarli, charchatuvchi"}];
  var INT = [0, 1, 3, 7, 14, 30]; // days until next review for box 1..6 (box 1 = same session)
  var NEW_LIMIT = 10;
  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function dayKey(d) { return window.actKey(d); }
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return dayKey(d); }
  function lang() { return window.getLang ? window.getLang() : "en"; }

  var data = (function () {
    try { var d = JSON.parse(localStorage.getItem("cards_v1") || "null"); if (d && d.prog) return d; } catch (e) {}
    return { prog: {}, custom: [], newDay: "", newN: 0 };
  })();
  if (!Array.isArray(data.custom)) data.custom = [];
  function save() { try { localStorage.setItem("cards_v1", JSON.stringify(data)); } catch (e) {} }

  var queue = [], cur = null, shown = false, reviewed = 0, started = false, awarded = false;

  function allCards() {
    return WORDS.map(function (w) { return { id: w.id, w: w.w, p: w.p, d: w.d, ru: w.ru, uz: w.uz, own: false }; })
      .concat(data.custom.map(function (c) { return { id: c.id, w: c.f, b: c.k, own: true }; }));
  }
  function rec(id) { return data.prog[id]; }
  function today() { return dayKey(); }
  function newLeft() { return Math.max(0, NEW_LIMIT - (data.newDay === today() ? data.newN : 0)); }

  function dueCards() {
    var t0 = today();
    return allCards().filter(function (c) { var r = rec(c.id); return r && r.d <= t0; })
      .sort(function (a, b) { return rec(a.id).b - rec(b.id).b; });
  }
  function unseen() { return allCards().filter(function (c) { return !rec(c.id); }); }

  function stats() {
    var all = allCards(), learned = 0, i;
    all.forEach(function (c) { var r = rec(c.id); if (r && r.b >= 4) learned++; });
    $("cdDue").textContent = dueCards().length;
    $("cdNew").textContent = Math.min(newLeft(), unseen().length);
    $("cdLearned").textContent = learned;
    $("cdTotal").textContent = t("cd_total") + ": " + all.length;
  }

  function buildQueue(extraNew) {
    queue = dueCards();
    var n = extraNew === undefined ? newLeft() : extraNew;
    unseen().slice(0, n).forEach(function (c) { queue.push(c); });
    return queue.length;
  }

  function speak(word) {
    try {
      if (!window.speechSynthesis) return;
      var u = new SpeechSynthesisUtterance(word); u.lang = "en-US"; u.rate = 0.9;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function back(c) {
    if (c.own) return esc(c.b);
    var l = lang(), tr = l === "uz" ? c.uz : l === "ru" ? c.ru : c.d;
    return "<b>" + esc(tr) + "</b>" + (l === "en" ? "" : '<div class="note" style="margin-top:8px">' + esc(c.d) + "</div>");
  }

  function render() {
    stats();
    var box = $("cdMain");
    if (!cur) {
      var due = dueCards().length, nw = Math.min(newLeft(), unseen().length);
      if (!started && due + nw > 0) {
        box.innerHTML = '<div class="cd-mas">' + window.mascot("happy") + '</div><p class="note" style="margin:0 0 14px">' + t("cd_deck") + '</p><button class="btn lg" id="cdStart">' + t("cd_start") + " (" + (due + nw) + ")</button>";
        $("cdStart").onclick = function () { started = true; reviewed = 0; awarded = false; buildQueue(); next(); };
        return;
      }
      var canMore = unseen().length > 0;
      box.innerHTML = '<div class="cd-mas">' + window.mascot(reviewed > 0 ? "cheer" : "think") + "</div><h2 style=\"margin:0 0 6px\">" + t("cd_done_t") + "</h2><p class=\"note\" style=\"margin:0 0 14px\">" +
        (reviewed > 0 ? t("cd_session").replace("{n}", reviewed) + " " : "") + t("cd_done_d") + "</p>" +
        (canMore ? '<button class="btn" id="cdMore">' + t("cd_more") + "</button> " : '<p class="note">' + t("cd_nomore") + "</p>") +
        ' <a class="btn ghost" href="/today">' + t("cd_go_today") + "</a>";
      var m = $("cdMore"); if (m) m.onclick = function () { started = true; buildQueue(5); next(); };
      return;
    }
    var c = cur, pos = c.p ? '<span class="note" style="margin-left:8px">' + t("cd_pos_" + c.p) + "</span>" : "";
    box.innerHTML = '<p class="note" style="margin:0 0 10px">' + t("cd_left").replace("{n}", queue.length + 1) + '</p><div class="cd-card"><div class="cd-word">' + esc(c.w) + pos + "</div>" +
      (c.own ? "" : '<button class="chip" id="cdSpk">🔊 ' + t("cd_speak") + "</button>") +
      (shown ? '<div class="cd-back">' + back(c) + "</div>" : "") + "</div>" +
      (shown ? '<div class="cd-btns"><button class="btn ghost" data-r="0">😕 ' + t("cd_forgot") + '</button><button class="btn ghost" data-r="1">🤔 ' + t("cd_hard") + '</button><button class="btn" data-r="2">✅ ' + t("cd_know") + "</button></div>"
             : '<button class="btn lg" id="cdShow">' + t("cd_show") + "</button>");
    var sp = $("cdSpk"); if (sp) sp.onclick = function () { speak(c.w); };
    var sh = $("cdShow"); if (sh) sh.onclick = function () { shown = true; render(); };
    box.querySelectorAll("[data-r]").forEach(function (b) { b.onclick = function () { rate(+b.getAttribute("data-r")); }; });
  }

  function next() { cur = queue.shift() || null; shown = false; render(); }

  function rate(r) {
    var c = cur, rc = rec(c.id), isNew = !rc, b = rc ? rc.b : 1;
    if (isNew && data.newDay !== today()) { data.newDay = today(); data.newN = 0; }
    if (isNew) data.newN++;
    if (r === 0) { b = 1; data.prog[c.id] = { b: 1, d: today() }; queue.push(c); }
    else if (r === 1) { data.prog[c.id] = { b: b, d: addDays(Math.max(1, INT[b - 1] || 1)) }; }
    else { b = Math.min(6, b + 1); data.prog[c.id] = { b: b, d: addDays(INT[b - 1]) }; }
    reviewed++;
    save();
    if (reviewed >= 5 && !awarded) { awarded = true; if (window.recordAct) recordAct("cards", 20); }
    next();
  }

  // my words
  function renderMine() {
    $("cdMineT").textContent = t("cd_mine");
    var h = data.custom.map(function (c) {
      return '<div class="tk-row" data-id="' + c.id + '" style="display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)"><span style="flex:1;min-width:0;word-break:break-word"><b>' + esc(c.f) + "</b> — " + esc(c.k) + '</span><button class="chip rm">' + t("cd_del") + "</button></div>";
    }).join("");
    $("cdMine").innerHTML = h || '<p class="note" style="margin:0">' + t("cd_mine_empty") + "</p>";
    $("cdMine").querySelectorAll(".tk-row").forEach(function (r) {
      r.querySelector(".rm").onclick = function () {
        var id = r.getAttribute("data-id");
        data.custom = data.custom.filter(function (x) { return x.id !== id; }); delete data.prog[id]; save(); queue = queue.filter(function (x) { return x.id !== id; });
        if (cur && cur.id === id) next(); else render();
        renderMine();
      };
    });
  }
  function addCard() {
    var clean = function (v, n) { return v.replace(/[\u0000-\u001f]/g, "").trim().slice(0, n); };
    var f = clean($("cdF").value, 40), k = clean($("cdB").value, 80);
    if (!f || !k || data.custom.length >= 200) return;
    data.custom.push({ id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 4), f: f, k: k });
    $("cdF").value = ""; $("cdB").value = ""; save(); renderMine(); render();
  }
  $("cdAdd").onclick = addCard;
  $("cdB").onkeydown = function (ev) { if (ev.key === "Enter") addCard(); };

  var armed = false;
  $("cdReset").onclick = function () {
    if (!armed) { armed = true; this.textContent = t("cd_reset_ok"); var me = this; setTimeout(function () { armed = false; me.textContent = t("cd_reset"); }, 3500); return; }
    armed = false; data.prog = {}; data.newDay = ""; data.newN = 0; save(); cur = null; started = false; queue = []; reviewed = 0; labels(); render();
  };

  function labels() {
    $("cdF").placeholder = t("cd_front"); $("cdB").placeholder = t("cd_back"); $("cdAdd").textContent = t("cd_add"); $("cdReset").textContent = t("cd_reset");
  }
  window.onLang = function () { labels(); renderMine(); render(); };
  labels(); renderMine(); render();
})();

<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    var b = document.getElementById("install"); if (b) b.hidden = false;
  });
  window.addEventListener("appinstalled", function () {
    deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true;
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target || ev.target.id !== "install" || !deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true; });
  });
})();
</script>
