<nav id="nav"></nav>

<main class="wrap">

    <p class="lead" data-i18n="fx_lead"></p>
  </div>

  <section>
    <div class="fx-grid">
      <div class="card fx-main">
        <div class="fx-modes" id="fxModes"></div>
        <div class="fx-ringwrap">
          <svg class="fx-ring" viewBox="0 0 200 200" aria-hidden="true"><circle class="bg" cx="100" cy="100" r="88"/><circle class="fg" id="fxArc" cx="100" cy="100" r="88"/></svg>
          <div class="fx-time" id="fxTime" role="timer" aria-live="off">25:00</div>
        </div>
        <div class="fx-durs" id="fxDurs"></div>
        <input class="fx-task" id="fxTask" maxlength="60" data-ph="fx_task" autocomplete="off">
        <div class="fx-btns">
          <button class="btn" id="fxGo"></button>
          <button class="btn ghost" id="fxReset"></button>
        </div>
        <p class="fx-msg" id="fxMsg" aria-live="polite"></p>
      </div>
      <div class="fx-side">
        <div class="card fx-live">
          <div class="fx-mascot" id="fxMas"></div>
          <div class="fx-livenum"><span class="dot off" id="fxDot"></span><span id="fxLive">–</span></div>
          <div data-i18n="fx_live"></div>
          <p class="note" id="fxIn" style="margin:8px 0 0"></p>
          <p class="note" id="fxNet" style="margin:6px 0 0"></p>
        </div>
        <div class="card fx-stats">
          <h3 style="margin:0 0 6px" data-i18n="fx_today"></h3>
          <div class="row"><span data-i18n="fx_min"></span><b id="stMin">0</b></div>
          <div class="row"><span data-i18n="fx_sessions"></span><b id="stSes">0</b></div>
          <div class="row"><span data-i18n="fx_streak"></span><b id="stStr">0</b></div>
          <div class="fx-bars" id="stBars"></div>
        </div>
      </div>
    </div>
    <p class="note" style="text-align:center;max-width:640px;margin:22px auto 0" data-i18n="fx_priv"></p>
  </section>

  <div class="band">
    <h2 data-i18n="go_t"></h2>
    <p data-i18n="go_d"></p>
    <a class="btn white" href="/predict" data-i18n="go_b"></a>

    var a = window.actLoad(), d = new Date(), n = 0;
    if (!window.actDone(a.days[window.actKey(d)])) d.setDate(d.getDate() - 1);

    var ns = document.getElementById("navStreak");
    if (ns) ns.textContent = window.actStreak();
    var lb = document.getElementById("lang");
    if (lb) lb.value = lang;
    if (window.onLang) window.onLang();
  }
  window.applyLang = applyLang;

  function setTheme(m) {

  document.addEventListener("DOMContentLoaded", function () {

    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    setTheme(saved || "dark");
    document.getElementById("theme").onclick = function () {

    };

  "fx_going": "Fokus. Telefonni chetga qo'ying.",
  "fx_today": "Bugun", "fx_min": "O'qilgan daqiqalar", "fx_sessions": "Tugagan sessiyalar", "fx_streak": "Ketma-ket kunlar",
  "fx_priv": "Maxfiylik: xona faqat anonim tashrif buyuruvchilarni sanaydi. Ism, xabar va akkaunt yo'q. Vazifa matni va statistikangiz faqat qurilmangizda saqlanadi.",
  "fx_min_u": "daq"
});
</script>
<script>
(function () {
  var C = 2 * Math.PI * 88;
  var DUR = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
  var mode = "focus", focusMin = 25, running = false, endAt = 0, remain = DUR.focus, mood = "happy", msgKey = "";
  var live = null, total = null, net = "conn", audio = null;
  var $ = function (id) { return document.getElementById(id); };
  var sid = Math.random().toString(36).slice(2) + Date.now().toString(36);

  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function loadStats() {
    try { var s = JSON.parse(localStorage.getItem("fx_stats") || "null"); if (s && s.days && s.ses) return s; } catch (e) {}
    return { days: {}, ses: {} };
  }
  function saveStats() { try { localStorage.setItem("fx_stats", JSON.stringify(stats)); } catch (e) {} }
  var stats = loadStats();
  try { var fm = +localStorage.getItem("fx_focusmin"); if (fm === 15 || fm === 25 || fm === 50) { focusMin = fm; DUR.focus = fm * 60; remain = DUR.focus; } } catch (e) {}
  try { $("fxTask").value = localStorage.getItem("fx_task") || ""; } catch (e) {}

  function fmt(s) { return ("0" + Math.floor(s / 60)).slice(-2) + ":" + ("0" + (s % 60)).slice(-2); }

  function streak() {
    var n = 0, d = new Date();
    if (!(stats.days[dayKey(d)] >= 60)) d.setDate(d.getDate() - 1);
    while (stats.days[dayKey(d)] >= 60) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function renderStats() {
    var k = dayKey();
    $("stMin").textContent = Math.floor((stats.days[k] || 0) / 60);
    $("stSes").textContent = stats.ses[k] || 0;
    $("stStr").textContent = streak();
    var vals = [], labels = [], max = 30 * 60, i, d;
    for (i = 6; i >= 0; i--) {
      d = new Date(); d.setDate(d.getDate() - i);
      var v = stats.days[dayKey(d)] || 0;
      vals.push(v); if (v > max) max = v;
      var lg = { ru: "ru", en: "en", uz: "uz" }[document.documentElement.lang] || "en", w;
      try { w = d.toLocaleDateString(lg, { weekday: "short" }); } catch (e) { w = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"][d.getDay()]; }
      labels.push(w);
    }
    $("stBars").innerHTML = vals.map(function (v, j) {
      return '<div title="' + Math.floor(v / 60) + " " + t("fx_min_u") + '"><i style="height:' + Math.round(v / max * 70) + 'px"></i>' + labels[j] + "</div>";
    }).join("");
  }

  function renderModes() {
    var h = "";
    ["focus", "short", "long"].forEach(function (m) {
      h += '<button data-m="' + m + '" class="' + (m === mode ? "cur" : "") + '">' + t("fx_m_" + m) + "</button>";
    });
    $("fxModes").innerHTML = h;
    $("fxModes").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () { setMode(b.getAttribute("data-m")); };
    });
    var d = "";
    if (mode === "focus") [15, 25, 50].forEach(function (m) {
      d += '<button data-d="' + m + '" class="' + (m === focusMin ? "cur" : "") + '"' + (running ? " disabled" : "") + ">" + m + " " + t("fx_min_u") + "</button>";
    });
    $("fxDurs").innerHTML = d;
    $("fxDurs").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (running) return;
        focusMin = +b.getAttribute("data-d"); DUR.focus = focusMin * 60; remain = DUR.focus;
        try { localStorage.setItem("fx_focusmin", focusMin); } catch (e) {}
        render();
      };
    });
  }

  function render() {
    renderModes();
    var tot = DUR[mode];
    $("fxArc").style.strokeDasharray = C;
    $("fxArc").style.strokeDashoffset = C * (1 - remain / tot);
    $("fxTime").textContent = fmt(remain);
    var started = remain < tot;
    $("fxGo").textContent = running ? t("fx_pause") : (started ? t("fx_resume") : t("fx_start"));
    $("fxReset").textContent = t("fx_reset");
    $("fxMsg").textContent = running && mode === "focus" ? t("fx_going") : (msgKey ? t(msgKey) : "");
    $("fxMas").innerHTML = window.mascot(running && mode === "focus" ? "think" : mood);
    document.title = running ? fmt(remain) + " · " + t("fx_m_" + mode) : t("doc_title");
    renderNet();
    renderStats();
  }

  function renderNet() {
    $("fxLive").textContent = live === null ? "–" : live;
    $("fxDot").className = "dot" + (net === "ok" ? "" : " off");
    $("fxIn").textContent = total === null ? "" : t("fx_in").replace("{n}", total);
    $("fxNet").textContent = net === "conn" ? t("fx_conn") : net === "off" ? t("fx_off") : "";
  }

  function setMode(m) {
    running = false; mode = m; remain = DUR[m]; msgKey = ""; mood = "happy";
    render(); ping();
  }

  function beep() {
    try {
      if (!audio) return;
      [0, 0.28].forEach(function (off, i) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = i ? 880 : 660;
        g.gain.setValueAtTime(0.0001, audio.currentTime + off);
        g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + off + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + off + 0.25);
        o.connect(g); g.connect(audio.destination);
        o.start(audio.currentTime + off); o.stop(audio.currentTime + off + 0.3);
      });
    } catch (e) {}
  }

  function addSeconds(s) {
    if (s <= 0) return;
    var k = dayKey(); stats.days[k] = (stats.days[k] || 0) + s; saveStats();
  }

  function complete() {
    running = false;
    beep();
    if (mode === "focus") {
      var k = dayKey(); stats.ses[k] = (stats.ses[k] || 0) + 1; saveStats();
      if (window.recordAct) recordAct("focus", 25);
      mode = "short"; msgKey = "fx_done"; mood = "cheer";
    } else {
      mode = "focus"; msgKey = "fx_bdone"; mood = "happy";
    }
    remain = DUR[mode];
    render(); ping();
  }

  function tick() {
    if (!running) return;
    var rem = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (mode === "focus") addSeconds(remain - rem);
    remain = rem;
    if (rem <= 0) { complete(); return; }
    render();
  }

  $("fxGo").onclick = function () {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audio && audio.state === "suspended") { try { audio.resume(); } catch (e) {} }
    if (running) { running = false; }
    else { running = true; endAt = Date.now() + remain * 1000; msgKey = ""; mood = "happy"; }
    render(); ping();
  };
  $("fxReset").onclick = function () {
    running = false; remain = DUR[mode]; msgKey = ""; mood = "happy"; render(); ping();
  };
  $("fxTask").oninput = function () { try { localStorage.setItem("fx_task", this.value); } catch (e) {} };

  function ping() {
    var studying = running && mode === "focus";
    if (document.hidden && !studying) return;
    try {
      fetch(window.API + "/api/room/ping", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sid: sid, studying: studying })
      }).then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); })
        .then(function (d) { live = d.studying; total = d.total; net = "ok"; renderNet(); })
        .catch(function () { net = "off"; renderNet(); });
    } catch (e) { net = "off"; renderNet(); }
  }

  setInterval(tick, 250);
  setInterval(ping, 20000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { tick(); ping(); } });

  window.onLang = function () {
    $("fxTask").placeholder = t("fx_task");
    render();
  };
  render();
  ping();
})();
</script>
<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    var b = document.getElementById("install"); if (b) b.hidden = false;
  });
  window.addEventListener("appinstalled", function () {
    deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true;
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target || ev.target.id !== "install" || !deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true; });
  });
})();
</script>
</body>
</html>
