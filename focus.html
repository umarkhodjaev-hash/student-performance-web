<body>
<nav id="nav"></nav>

<main class="wrap">
  <div class="phead">
    <span class="crumb" data-i18n="crumb"></span>
    <h1 data-i18n="fx_title"></h1>
    <p class="lead" data-i18n="fx_lead"></p>
  </div>

  <section>
    <div class="fx-grid">
      <div class="card fx-main">
        <div class="fx-modes" id="fxModes"></div>
        <div class="fx-ringwrap">
          <svg class="fx-ring" viewBox="0 0 200 200" aria-hidden="true"><circle class="bg" cx="100" cy="100" r="88"/><circle class="fg" id="fxArc" cx="100" cy="100" r="88"/></svg>
          <div class="fx-time" id="fxTime" role="timer" aria-live="off">25:00</div>
        </div>
        <div class="fx-durs" id="fxDurs"></div>
        <input class="fx-task" id="fxTask" maxlength="60" data-ph="fx_task" autocomplete="off">
        <div class="fx-btns">
          <button class="btn" id="fxGo"></button>
          <button class="btn ghost" id="fxReset"></button>
        </div>
        <p class="fx-msg" id="fxMsg" aria-live="polite"></p>
      </div>
      <div class="fx-side">
        <div class="card fx-live">
          <div class="fx-mascot" id="fxMas"></div>
          <div class="fx-livenum"><span class="dot off" id="fxDot"></span><span id="fxLive">–</span></div>
          <div data-i18n="fx_live"></div>
          <p class="note" id="fxIn" style="margin:8px 0 0"></p>
          <p class="note" id="fxNet" style="margin:6px 0 0"></p>
        </div>
        <div class="card fx-stats">
          <h3 style="margin:0 0 6px" data-i18n="fx_today"></h3>
          <div class="row"><span data-i18n="fx_min"></span><b id="stMin">0</b></div>
          <div class="row"><span data-i18n="fx_sessions"></span><b id="stSes">0</b></div>
          <div class="row"><span data-i18n="fx_streak"></span><b id="stStr">0</b></div>
          <div class="fx-bars" id="stBars"></div>
        </div>
      </div>
    </div>
    <div class="card tm" id="tm" style="margin-top:22px">
      <div class="tm-head">
        <div>
          <h3 style="margin:0 0 4px" data-i18n="tm_title"></h3>
          <p class="note" style="margin:0" id="tmLead"></p>
        </div>
      </div>
      <div id="tmBody"></div>
    </div>
    <p class="note" style="text-align:center;max-width:640px;margin:22px auto 0" data-i18n="fx_priv"></p>
  </section>

  <div class="band">
    <h2 data-i18n="go_t"></h2>
    <p data-i18n="go_d"></p>
    <a class="btn white" href="/predict" data-i18n="go_b"></a>
  </div>
</main>

<script>
(function () {

  var live = null, total = null, net = "conn", audio = null;
  var $ = function (id) { return document.getElementById(id); };
  var sid = Math.random().toString(36).slice(2) + Date.now().toString(36);

  function dayKey(d) {

  }
  function loadStats() {

  try { $("fxTask").value = localStorage.getItem("fx_task") || ""; } catch (e) {}

    return n;
  }

  function renderStats() {
    var k = dayKey();

      d = new Date(); d.setDate(d.getDate() - i);

      return '<div title="' + Math.floor(v / 60) + " " + t("fx_min_u") + '"><i style="height:' + Math.round(v / max * 70) + 'px"></i>' + labels[j] + "</div>";
    }).join("");
  }

  function renderModes() {
    var h = "";
    ["focus", "short", "long"].forEach(function (m) {
      h += '<button data-m="' + m + '" class="' + (m === mode ? "cur" : "") + '">' + t("fx_m_" + m) + "</button>";
    });
    $("fxModes").innerHTML = h;
    $("fxModes").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () { setMode(b.getAttribute("data-m")); };
    });
    var d = "";
    if (mode === "focus") [15, 25, 50].forEach(function (m) {
      d += '<button data-d="' + m + '" class="' + (m === focusMin ? "cur" : "") + '"' + (running ? " disabled" : "") + ">" + m + " " + t("fx_min_u") + "</button>";
    });
    $("fxDurs").innerHTML = d;
    $("fxDurs").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (running) return;
        focusMin = +b.getAttribute("data-d"); DUR.focus = focusMin * 60; remain = DUR.focus;
        try { localStorage.setItem("fx_focusmin", focusMin); } catch (e) {}
        render();
      };
    });
  }

  function render() {
    renderModes();
    var tot = DUR[mode];
    $("fxArc").style.strokeDasharray = C;
    $("fxArc").style.strokeDashoffset = C * (1 - remain / tot);
    $("fxTime").textContent = fmt(remain);
    var started = remain < tot;
    $("fxGo").textContent = running ? t("fx_pause") : (started ? t("fx_resume") : t("fx_start"));
    $("fxReset").textContent = t("fx_reset");
    $("fxMsg").textContent = running && mode === "focus" ? t("fx_going") : (msgKey ? t(msgKey) : "");
    $("fxMas").innerHTML = window.mascot(running && mode === "focus" ? "think" : mood);
    document.title = running ? fmt(remain) + " · " + t("fx_m_" + mode) : t("doc_title");
    renderNet();
    renderStats();
  }

  function renderNet() {
    $("fxLive").textContent = live === null ? "–" : live;
    $("fxDot").className = "dot" + (net === "ok" ? "" : " off");
    $("fxIn").textContent = total === null ? "" : t("fx_in").replace("{n}", total);
    $("fxNet").textContent = net === "conn" ? t("fx_conn") : net === "off" ? t("fx_off") : "";
  }

  function setMode(m) {
    running = false; mode = m; remain = DUR[m]; msgKey = ""; mood = "happy";
    render(); ping();
  }

  function beep() {
    try {
      if (!audio) return;

  }

  function addSeconds(s) {

  }

  function complete() {
    running = false;
    beep();
    if (mode === "focus") {
      var k = dayKey(); stats.ses[k] = (stats.ses[k] || 0) + 1; saveStats();

    render(); ping();
  }

  function tick() {
    if (!running) return;

  $("fxGo").onclick = function () {

    render(); ping();
  };
  $("fxReset").onclick = function () {
    running = false; remain = DUR[mode]; msgKey = ""; mood = "happy"; render(); ping();
  };
  $("fxTask").oninput = function () { try { localStorage.setItem("fx_task", this.value); } catch (e) {} };

  function ping() {
    teamPing();
    var studying = running && mode === "focus";

      fetch(window.API + "/api/room/ping", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sid: sid, studying: studying })

        .catch(function () { net = "off"; renderNet(); });
    } catch (e) { net = "off"; renderNet(); }
  }


  /* ---------- private study room by link ---------- */
  var TEAM_ALPHA = "abcdefghjkmnpqrstuvwxyz23456789";
  var team = null, teamInfo = null, teamMembers = null, teamErr = "", invite = null, copyMsg = false;
  try { team = JSON.parse(localStorage.getItem("fx_team") || "null"); if (team && !/^[a-z0-9]{4,12}$/.test(team.code || "")) team = null; } catch (e) { team = null; }

  var savedName = ""; try { savedName = localStorage.getItem("fx_name") || ""; } catch (e) {}

  function weekMinutes() {
    var d = new Date(), dow = (d.getDay() + 6) % 7, sec = 0, i;
    for (i = 0; i <= dow; i++) { var x = new Date(); x.setDate(x.getDate() - i); sec += stats.days[dayKey(x)] || 0; }
    return Math.floor(sec / 60);
  }
  function todayMinutes() { return Math.floor((stats.days[dayKey()] || 0) / 60); }
  function cleanTitle(v) { return (v || "").replace(/[\u0000-\u001f<>&"'`]/g, "").trim().slice(0, 30); }
  function cleanName(v) { return (v || "").replace(/[\u0000-\u001f<>&"'`]/g, "").trim().slice(0, 20); }
  function teamLink() { return location.origin + "/focus?room=" + team.code; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function teamPing() {
    if (!team) return;

      fetch(window.API + "/api/team/ping", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: team.code, sid: tmSid, name: team.name, studying: running && mode === "focus", today_min: todayMinutes(), week_min: weekMinutes(), title: team.title || "", kind: team.kind || "room" })
      }).then(function (r) {

        if (!r.ok) throw new Error("err");
        return r.json();
      }).then(function (d) { teamMembers = d.members; teamInfo = { title: d.title || "", kind: d.kind || "room", total: d.total_week || 0, count: d.count || 0 }; teamErr = ""; renderTeam(); })
        .catch(function (e) { teamErr = e.message === "full" ? "tm_full" : "tm_err"; renderTeam(); });
    } catch (e) { teamErr = "tm_err"; renderTeam(); }
  }

  function joinTeam(code, name, kind, title) {

  function copyLink(btn) {

    var lead = $("tmLead");
    if (!team) {
      lead.textContent = invite ? t("tm_invited") : t("tm_lead");
      var row = el("div", "tm-form");
      var inp = el("input", "fx-task"); inp.id = "tmName"; inp.maxLength = 20; inp.placeholder = t("tm_name"); inp.value = savedName; inp.autocomplete = "off";
      var go = el("button", "btn", invite ? t("tm_join") : t("tm_create"));
      go.onclick = function () { joinTeam(invite || newCode(), inp.value); };
      inp.onkeydown = function (ev) { if (ev.key === "Enter") go.click(); };
      row.appendChild(inp); row.appendChild(go); body.appendChild(row);
      if (!invite) {
        var row2 = el("div", "tm-form"); row2.style.marginTop = "10px";
        var ct = el("input", "fx-task"); ct.id = "tmClass"; ct.maxLength = 30; ct.placeholder = t("tm_class_name"); ct.autocomplete = "off";
        var gc = el("button", "btn ghost", "🏫 " + t("tm_create_class"));
        gc.onclick = function () { joinTeam(newCode(), inp.value, "class", ct.value || t("tm_class_def")); };
        ct.onkeydown = function (ev) { if (ev.key === "Enter") gc.click(); };
        row2.appendChild(ct); row2.appendChild(gc); body.appendChild(row2);
        body.appendChild(el("p", "note", t("tm_class_hint")));
      }
      return;
    }
    lead.textContent = t("tm_lead_in");
    var isClass = !!(teamInfo ? teamInfo.kind === "class" : team.kind === "class");
    var ttl = (teamInfo && teamInfo.title) || team.title || "";
    if (isClass) {
      var hd = el("h4", "tm-sub", "🏫 " + (ttl || t("tm_class_def"))); hd.style.fontSize = "20px"; body.appendChild(hd);
      if (teamInfo) body.appendChild(el("p", "note", t("tm_class_total") + ": " + teamInfo.total + " " + t("fx_min_u") + " · " + t("tm_students") + ": " + teamInfo.count));
    }
    var inv = el("div", "tm-invite");
    var lab = el("span", "tm-lab", t("tm_invite"));
    var box = el("input", "tm-link"); box.readOnly = true; box.value = teamLink(); box.onfocus = function () { box.select(); };
    var cp = el("button", "btn ghost", copyMsg ? t("tm_copied") : t("tm_copy")); cp.onclick = function () { copyLink(cp); };
    var tg = el("a", "btn", t("tm_tg")); tg.target = "_blank"; tg.rel = "noopener";
    tg.href = "https://t.me/share/url?url=" + encodeURIComponent(teamLink()) + "&text=" + encodeURIComponent(isClass ? t("tm_text_c") + (ttl ? ": " + ttl : "") : t("tm_text"));
    inv.appendChild(lab); inv.appendChild(box); inv.appendChild(cp); inv.appendChild(tg); body.appendChild(inv);

    body.appendChild(el("h4", "tm-sub", t("tm_members")));
    if (teamErr) body.appendChild(el("p", "note", t(teamErr)));
    if (!teamMembers) { if (!teamErr) body.appendChild(el("p", "note", t("tm_wait"))); }
    else {
      var list = el("div", "tm-rows");
      teamMembers.forEach(function (m, i) {
        var r = el("div", "tm-row" + (m.you ? " me" : ""));
        r.appendChild(el("span", "tm-rank", isClass && i < 3 && m.week_min > 0 ? ["🥇", "🥈", "🥉"][i] : String(i + 1)));
        var st = el("span", "tm-dot" + (m.studying ? " on" : m.online ? " idle" : ""));
        st.title = m.studying ? t("tm_studying") : m.online ? t("tm_online") : t("tm_offline");
        r.appendChild(st);
        var nm = el("span", "tm-name", m.name + (m.you ? " (" + t("tm_you") + ")" : ""));
        var sub = el("small", "", m.studying ? t("tm_studying") : m.online ? t("tm_online") : t("tm_offline"));
        var nc = el("span", "tm-nc"); nc.appendChild(nm); nc.appendChild(sub); r.appendChild(nc);
        var mins = el("span", "tm-min"); var b = el("b", "", String(m.week_min)); mins.appendChild(b);
        mins.appendChild(el("small", "", t("fx_min_u") + " " + t("tm_week")));
        mins.appendChild(el("small", "", m.today_min + " " + t("fx_min_u") + " " + t("tm_today")));
        r.appendChild(mins);
        list.appendChild(r);
      });
      body.appendChild(list);
      if (teamMembers.length < 2) body.appendChild(el("p", "note", t("tm_empty")));
    }
    var lv = el("button", "chip", t("tm_leave")); lv.style.marginTop = "16px"; lv.onclick = leaveTeam; body.appendChild(lv);
  }

  setInterval(tick, 250);
  setInterval(ping, 20000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { tick(); ping(); } });

  window.onLang = function () {
    $("fxTask").placeholder = t("fx_task");
    render();
    renderTeam();
  };
  render();
  renderTeam();
  ping();
})();
</script>
<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    var b = document.getElementById("install"); if (b) b.hidden = false;
  });
  window.addEventListener("appinstalled", function () {
    deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true;
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target || ev.target.id !== "install" || !deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true; });
  });
})();
</script>
</body>
</html>
