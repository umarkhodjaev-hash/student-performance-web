var QTOPICS = {
  h: { pre: "q", n: 8, ok: [1, 2, 0, 1, 2, 0, 2, 1], ic: "📅" },
  m: { pre: "mq", n: 8, ok: [2, 0, 1, 2, 2, 1, 1, 0], ic: "🧠" },
  e: { pre: "eq", n: 8, ok: [1, 2, 0, 1, 2, 1, 0, 2], ic: "🎯" }
};
var qtopic = null, QN = 0, QCORRECT = [], qpre = "q", qi = 0, score = 0, picked = null, qDone = false;

function qBest() { try { return JSON.parse(localStorage.getItem("qbest") || "{}") || {}; } catch (e) { return {}; } }
function qSaveBest() {
  try { var b = qBest(); if (b[qtopic] === undefined || score > b[qtopic]) b[qtopic] = score; localStorage.setItem("qbest", JSON.stringify(b)); } catch (e) {}
}
function qStart(k) {
  var tp = QTOPICS[k]; qtopic = k; QN = tp.n; QCORRECT = tp.ok; qpre = tp.pre;
  qi = 0; score = 0; picked = null; qDone = false;
  qRender(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function qPicker(box) {
  var best = qBest();
  var h = '<h2 style="font-size:20px;margin-bottom:14px">' + t("qz_pick") + "</h2>";
  ["h", "m", "e"].forEach(function (k) {
    var tp = QTOPICS[k], b = best[k];
    var st = b === undefined ? t("qz_new") : t("qz_best").replace("{s}", b).replace("{m}", tp.n);
    h += '<button class="qopt" data-topic="' + k + '"><b>' + tp.ic + " " + t("tp_" + k + "_t") + '</b><br><span class="note" style="margin:0">' +
      t("tp_" + k + "_d") + '</span><br><span class="note" style="margin:4px 0 0;display:block;font-size:13px">' + st + "</span></button>";
  });
  box.innerHTML = h;
  box.querySelectorAll("[data-topic]").forEach(function (b) { b.onclick = function () { qStart(b.getAttribute("data-topic")); }; });
}

function qRender() {
  var box = document.getElementById("qbox");
  if (!qtopic) { qPicker(box); return; }
  if (qi >= QN) { qResult(box); return; }
  var n = qi + 1, ok = QCORRECT[qi], K = qpre + n;
  var h = '<div class="qprog"><i style="width:' + (qi / QN * 100) + '%"></i></div>' +
    '<p class="note" style="margin:0 0 8px">' + t("qz_prog").replace("{n}", n).replace("{m}", QN) + "</p>" +
    '<h2 style="font-size:22px;margin-bottom:16px">' + t(K) + "</h2>";
  ["a", "b", "c"].forEach(function (k, i) {
    var cl = "qopt";
    if (picked !== null) cl += i === ok ? " ok" : i === picked ? " bad" : "";
    h += '<button class="' + cl + '" data-i="' + i + '"' + (picked !== null ? " disabled" : "") + ">" + t(K + k) + "</button>";
  });
  if (picked !== null) {
    h += '<div class="qexp"><b>' + (picked === ok ? t("qz_right") : t("qz_wrong")) + "</b> " + t(K + "e") + "</div>" +
      '<button class="btn" id="qnext">' + (qi === QN - 1 ? t("qz_finish") : t("qz_next")) + "</button>";
  }
  h += '<p style="margin:16px 0 0"><button class="btn ghost small" id="qtopics">' + t("qz_topics") + "</button></p>";
  box.innerHTML = h;
  box.querySelectorAll(".qopt").forEach(function (b) {
    b.onclick = function () {
      if (picked !== null) return;
      picked = +b.getAttribute("data-i");
      if (picked === QCORRECT[qi]) score++;
      qRender();
    };
  });
  var nx = document.getElementById("qnext");
  if (nx) nx.onclick = function () { qi++; picked = null; qRender(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  document.getElementById("qtopics").onclick = function () { qtopic = null; qRender(); };
}

function qResult(box) {
  if (!qDone) { qDone = true; qSaveBest(); if (window.recordAct) recordAct("quiz", 30); }
  var r = score / QN;
  var tier = r >= 0.85 ? 1 : r >= 0.6 ? 2 : r >= 0.35 ? 3 : 4;
  var mood = tier === 1 ? "cheer" : tier === 4 ? "think" : "happy";
  box.innerHTML = '<div class="qres"><div class="mres">' + mascot(mood) + "</div>" +
    '<p class="note" style="margin:0">' + t("qz_res_t") + "</p>" +
    '<div class="big">' + t("qz_score").replace("{s}", score).replace("{m}", QN) + "</div>" +
    '<p style="max-width:460px;margin:0 auto 22px">' + t("qz_t" + tier) + "</p>" +
    '<div class="cta" style="justify-content:center"><button class="btn ghost" id="qagain">' + t("qz_again") + '</button><button class="btn ghost" id="qtopics">' + t("qz_topics") + '</button><a class="btn" href="/improve">' + t("qz_imp") + "</a></div></div>";
  document.getElementById("qagain").onclick = function () { qStart(qtopic); };
  document.getElementById("qtopics").onclick = function () { qtopic = null; qRender(); };
}

window.onLang = qRender;
