var QN = 8, QCORRECT = [1, 2, 0, 1, 2, 0, 2, 1], qi = 0, score = 0, picked = null;

function qRender() {
  var box = document.getElementById("qbox");
  if (qi >= QN) { qResult(box); return; }
  var n = qi + 1, ok = QCORRECT[qi];
  var h = '<div class="qprog"><i style="width:' + (qi / QN * 100) + '%"></i></div>' +
    '<p class="note" style="margin:0 0 8px">' + t("qz_prog").replace("{n}", n).replace("{m}", QN) + "</p>" +
    '<h2 style="font-size:22px;margin-bottom:16px">' + t("q" + n) + "</h2>";
  ["a", "b", "c"].forEach(function (k, i) {
    var cl = "qopt";
    if (picked !== null) cl += i === ok ? " ok" : i === picked ? " bad" : "";
    h += '<button class="' + cl + '" data-i="' + i + '"' + (picked !== null ? " disabled" : "") + ">" + t("q" + n + k) + "</button>";
  });
  if (picked !== null) {
    h += '<div class="qexp"><b>' + (picked === ok ? t("qz_right") : t("qz_wrong")) + "</b> " + t("q" + n + "e") + "</div>" +
      '<button class="btn" id="qnext">' + (qi === QN - 1 ? t("qz_finish") : t("qz_next")) + "</button>";
  }
  box.innerHTML = h;
  box.querySelectorAll(".qopt").forEach(function (b) {
    b.onclick = function () {
      if (picked !== null) return;
      picked = +b.getAttribute("data-i");
      if (picked === QCORRECT[qi]) score++;
      qRender();
    };
  });
  var nx = document.getElementById("qnext");
  if (nx) nx.onclick = function () { qi++; picked = null; qRender(); window.scrollTo({ top: 0, behavior: "smooth" }); };
}

function qResult(box) {
  var tier = score >= 7 ? 1 : score >= 5 ? 2 : score >= 3 ? 3 : 4;
  var mood = tier === 1 ? "cheer" : tier === 4 ? "think" : "happy";
  box.innerHTML = '<div class="qres"><div class="mres">' + mascot(mood) + "</div>" +
    '<p class="note" style="margin:0">' + t("qz_res_t") + "</p>" +
    '<div class="big">' + t("qz_score").replace("{s}", score).replace("{m}", QN) + "</div>" +
    '<p style="max-width:460px;margin:0 auto 22px">' + t("qz_t" + tier) + "</p>" +
    '<div class="cta" style="justify-content:center"><button class="btn ghost" id="qagain">' + t("qz_again") + '</button><a class="btn" href="/improve">' + t("qz_imp") + "</a></div></div>";
  document.getElementById("qagain").onclick = function () { qi = 0; score = 0; picked = null; qRender(); };
}

window.onLang = qRender;
