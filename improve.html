<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    var b = document.getElementById("install"); if (b) b.hidden = false;
  });
  window.addEventListener("appinstalled", function () {
    deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true;
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target || ev.target.id !== "install" || !deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; var b = document.getElementById("install"); if (b) b.hidden = true; });
  });
})();
</script>
